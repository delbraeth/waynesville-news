name: Daily video brief

# Renders today's Daily Brief episode as an animated 1080p video after the
# daily audio is recorded. The MP4 and thumbnail are stored on Cloudflare R2
# at <R2_PUBLIC_URL>/video/<date>.mp4 and .jpg (the same bucket and secrets as
# the daily audio), and are also attached to this run as a 14-day download
# ("video-<date>" under Artifacts). The editor uploads to YouTube by hand.
#
# It posts nothing anywhere public and commits nothing. Fail-safe: the brief,
# the email and the audio never wait on it; a day with no recording is a quiet
# skip. See scripts/video/README.md.
on:
  workflow_run:
    workflows: ["Daily audio brief"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date to render (YYYY-MM-DD). Blank = today (Eastern)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Date
        id: d
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: echo "date=${INPUT_DATE:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Cache the speech model and map tiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            scripts/video/tiles
          key: video-${{ github.run_id }}
          restore-keys: video-
      - name: Install faster-whisper and Playwright
        run: |
          pip install --quiet faster-whisper==1.1.0 requests
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PYTHON: python
        run: node scripts/video/make-video.mjs --date "${{ steps.d.outputs.date }}" --out video-out
      - name: Attach the video to this run
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.d.outputs.date }}
          path: |
            video-out/*.mp4
            video-out/thumbnail-*.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Store the video on R2 (audio.waynesville.news/video/)
        env:
          DATE: ${{ steps.d.outputs.date }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          MP4="video-out/waynesville-brief-$DATE.mp4"
          if [ ! -f "$MP4" ]; then echo "no video for $DATE; nothing to store"; exit 0; fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets not set; the video is only in this run's artifacts"; exit 0
          fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "$MP4" "s3://$R2_BUCKET/video/$DATE.mp4" --endpoint-url "$EP" --content-type video/mp4 --region auto
          if [ -f "video-out/thumbnail-$DATE.jpg" ]; then
            aws s3 cp "video-out/thumbnail-$DATE.jpg" "s3://$R2_BUCKET/video/$DATE.jpg" --endpoint-url "$EP" --content-type image/jpeg --region auto
          fi
          echo "stored: ${R2_PUBLIC_URL%/}/video/$DATE.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
