name: Refresh (weather + weekday draft)

# Every morning: refresh weather from the NWS API and pull candidate headlines.
# On weekdays it also generates a fresh draft brief into drafts/. Everything that
# changes is committed (which redeploys the site for the weather update). The
# editor pulls, fills the draft's TODOs, and publishes.
on:
  schedule:
    - cron: "20 10 * * *" # ~6:20 AM Eastern daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Refresh weather (NWS)
        run: npm run refresh:weather || echo "weather refresh failed — kept previous"
      - name: Pull candidate headlines
        run: npm run refresh:headlines || echo "headlines refresh skipped/failed"
      - name: Generate weekday draft
        run: |
          dow=$(date -u +%u)   # 1=Mon .. 7=Sun (UTC morning == ET morning)
          if [ "$dow" -ge 1 ] && [ "$dow" -le 5 ]; then
            npm run draft
          else
            echo "Weekend — no draft generated."
          fi
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "waynesville-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "chore: daily refresh (weather + draft)"
            git push
          else
            echo "Nothing to commit."
          fi
