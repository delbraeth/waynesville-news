name: Refresh (weather + weekday draft)

# Every morning: refresh weather from the NWS API and pull candidate headlines.
# On weekdays it also generates a fresh draft brief into drafts/. Everything that
# changes is committed (which redeploys the site for the weather update). The
# editor pulls, fills the draft's TODOs, and publishes.
on:
  schedule:
    - cron: "20 10 * * *" # ~6:20 AM Eastern daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Chrome (for headline excerpts)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Refresh weather (NWS)
        run: npm run refresh:weather || echo "weather refresh failed — kept previous"
      - name: Pull candidate headlines
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run refresh:headlines || echo "headlines refresh skipped/failed"
      - name: Pull Prosecutor press releases
        run: npm run refresh:safety || echo "prosecutor press refresh skipped/failed"
      - name: Pull obituaries
        run: npm run refresh:obituaries || echo "obituaries refresh skipped/failed"
      - name: Pull Spartans sports schedule/results
        run: npm run refresh:sports || echo "sports refresh skipped/failed"
      - name: Pull library events
        run: npm run refresh:library || echo "library events refresh skipped/failed"
      - name: Pull Wayne Township agendas
        run: npm run refresh:township || echo "township agendas refresh skipped/failed"
      - name: Pull Merchant Association events
        run: npm run refresh:shops || echo "shops events refresh skipped/failed"
      - name: Generate weekday draft
        run: |
          dow=$(date -u +%u)   # 1=Mon .. 7=Sun (UTC morning == ET morning)
          if [ "$dow" -ge 1 ] && [ "$dow" -le 5 ]; then
            npm run draft
          else
            echo "Weekend — no draft generated."
          fi
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "waynesville-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "chore: daily refresh (weather + draft)"
            # Rebase onto whatever landed on main since checkout (e.g. a same-day
            # publish) before pushing, and retry once — avoids losing this commit
            # to a race instead of just failing the job.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..." && sleep 5
            done
          else
            echo "Nothing to commit."
          fi
