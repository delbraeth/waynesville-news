name: Refresh sources (manual safety net)

# MANUAL ONLY — the daily schedule was removed on 2026-09-17.
#
# This workflow and the "news-feed" scheduled Claude task were both refreshing
# the same nine sources every morning, 20 minutes apart, and both pushing to
# main. That caused a push race, and it meant whichever ran second overwrote the
# other's data. The Claude task now owns the daily run end to end: refreshing
# every source, gathering events, drafting and publishing the brief, and mailing
# subscribers.
#
# Two steps were also deleted rather than just unscheduled, because they corrupt
# state if anyone dispatches this by hand:
#   * "Generate weekday draft" — the Claude run creates the draft. If this ran
#     first, draft-brief.mjs would refuse to overwrite and the Claude run would
#     inherit a bare TODO scaffold instead of writing its own.
#   * "Pull obituaries" — obituaries now come from the funeral home's
#     notification emails, which only the Claude session can read. Running the
#     scraper here hits a Cloudflare-gated site, trips the staleness ceiling in
#     scripts/lib/stale-cache.mjs, and empties data the Claude run had just
#     written correctly.
#
# What's left is a hand-dispatchable refresh of the deterministic sources, for
# use if the Claude task is down and the data needs topping up.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Set up Chrome (for headline excerpts)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Refresh weather (NWS)
        run: npm run refresh:weather || echo "weather refresh failed — kept previous"
      - name: Pull candidate headlines
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run refresh:headlines || echo "headlines refresh skipped/failed"
      - name: Pull Prosecutor press releases
        run: npm run refresh:safety || echo "prosecutor press refresh skipped/failed"
      - name: Pull Spartans sports schedule/results
        run: npm run refresh:sports || echo "sports refresh skipped/failed"
      - name: Pull library events
        run: npm run refresh:library || echo "library events refresh skipped/failed"
      - name: Pull Wayne Township agendas
        run: npm run refresh:township || echo "township agendas refresh skipped/failed"
      - name: Pull Merchant Association events
        run: npm run refresh:shops || echo "shops events refresh skipped/failed"
      - name: Pull Village Council minutes (OCR)
        run: npm run refresh:village-minutes || echo "village minutes refresh skipped/failed"
      - name: Report source freshness
        run: npm run check:staleness || true
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "waynesville-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "chore: manual source refresh"
            # Rebase onto whatever landed on main since checkout (e.g. a same-day
            # publish) before pushing, and retry — avoids losing this commit to a
            # race. If a rebase conflicts, abort it so the next attempt starts
            # clean. If every attempt fails, FAIL the job loudly instead of
            # showing green while the day's refresh silently never landed.
            ok=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed, retrying..." && sleep 5
            done
            if [ "$ok" != "1" ]; then echo "All push attempts failed"; exit 1; fi
          else
            echo "Nothing to commit."
          fi
