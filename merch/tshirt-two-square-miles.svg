<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" width="1200" height="1300">
  <title>Waynesville — two square miles, surrounded by reality since 1797</title>
  <!-- Two ink colors only: cream + barn red. Transparent background; made for a dark shirt. -->
  <g font-family="Newsreader, Georgia, 'Times New Roman', serif" fill="#f3ead8" text-anchor="middle">

    <!-- Headline -->
    <text x="600" y="215" font-size="150" font-weight="700" letter-spacing="10" textLength="1020" lengthAdjust="spacingAndGlyphs">WAYNESVILLE</text>
    <line x1="90" y1="255" x2="1110" y2="255" stroke="#f3ead8" stroke-width="4"/>

    <!-- "Reality" ring around the town -->
    <rect x="240" y="320" width="720" height="420" fill="none" stroke="#9e2b25" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g font-family="system-ui, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e0574e" letter-spacing="4">
      <text x="600" y="306" textLength="680" lengthAdjust="spacing">REALITY · REALITY · REALITY</text>
      <text x="600" y="772" textLength="680" lengthAdjust="spacing">REALITY · REALITY · REALITY</text>
      <text transform="translate(222 530) rotate(-90)" textLength="380" lengthAdjust="spacing">REALITY · REALITY</text>
      <text transform="translate(978 530) rotate(90)" textLength="380" lengthAdjust="spacing">REALITY · REALITY</text>
    </g>

    <!-- The town: two square miles -->
    <rect x="300" y="380" width="600" height="300" fill="#9e2b25" fill-opacity="0.22" stroke="#f3ead8" stroke-width="6"/>
    <line x1="600" y1="380" x2="600" y2="505" stroke="#f3ead8" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="450" y="420" font-size="26" font-style="italic" opacity="0.8">1 sq. mi.</text>
    <text x="750" y="420" font-size="26" font-style="italic" opacity="0.8">1 sq. mi.</text>

    <!-- "You are here" pin -->
    <circle cx="600" cy="530" r="22" fill="#9e2b25" stroke="#f3ead8" stroke-width="5"/>
    <circle cx="600" cy="530" r="7" fill="#f3ead8"/>
    <text x="600" y="590" font-size="30" font-weight="700" letter-spacing="5">YOU ARE HERE</text>
    <text x="600" y="640" font-size="24" font-style="italic" opacity="0.8">(there is nowhere else)</text>

    <!-- Tagline -->
    <text x="600" y="880" font-size="96" font-weight="700" letter-spacing="6" textLength="900" lengthAdjust="spacingAndGlyphs">TWO SQUARE MILES</text>
    <text x="600" y="975" font-size="56" font-style="italic" fill="#e0574e">surrounded by reality</text>

    <!-- Since 1797 -->
    <line x1="90" y1="1033" x2="430" y2="1033" stroke="#f3ead8" stroke-width="4"/>
    <line x1="770" y1="1033" x2="1110" y2="1033" stroke="#f3ead8" stroke-width="4"/>
    <text x="600" y="1048" font-size="40" font-weight="700" letter-spacing="8">SINCE 1797</text>
    <text x="600" y="1120" font-size="26" letter-spacing="14" opacity="0.8">WARREN COUNTY · OHIO</text>
  </g>
</svg>
